<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:1080px;height:1920px;overflow:hidden}body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:#16231d;background:linear-gradient(160deg,#f7f4ec 0%,#e8f2ec 54%,#d7e9df 100%)}
    .poster{position:relative;width:1080px;height:1920px;padding:72px}.orb{position:absolute;border-radius:50%;background:#24594312}.o1{width:600px;height:600px;right:-260px;top:-230px}.o2{width:420px;height:420px;left:-240px;bottom:110px}.brand{display:flex;align-items:center;gap:20px;color:#245943;font-weight:900;font-size:26px;letter-spacing:4px}.brand img{width:78px;height:78px;border-radius:22px;box-shadow:0 14px 35px #24594326}.tag{position:absolute;right:72px;top:84px;padding:11px 20px;border-radius:99px;background:#245943;color:white;font-size:22px;font-weight:700}.title{font-size:78px;line-height:1.12;letter-spacing:-4px;margin:62px 0 22px}.title span{color:#245943}.lead{width:860px;font-size:28px;line-height:1.6;color:#52655b;margin:0}.phones{height:1010px;position:relative;margin-top:50px}.phone{position:absolute;width:302px;border:9px solid #17231d;border-radius:38px;overflow:hidden;background:white;box-shadow:0 30px 65px #173d2e2b}.phone img{width:100%;display:block}.p1{left:20px;top:62px;transform:rotate(-5deg)}.p2{left:315px;top:0;z-index:3}.p3{right:18px;top:70px;transform:rotate(5deg)}.features{position:absolute;left:72px;right:72px;bottom:108px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.feature{background:#ffffffc9;border:1px solid #d3e1d8;border-radius:22px;padding:22px 15px;text-align:center;font-size:21px;font-weight:800;box-shadow:0 12px 30px #173d2e0d}.feature b{display:block;color:#245943;font-size:34px;margin-bottom:4px}.foot{position:absolute;bottom:42px;left:72px;right:72px;text-align:center;color:#627269;font-size:18px}
  </style>
</head>
<body>
  <main class="poster">
    <i class="orb o1"></i><i class="orb o2"></i>
    <div class="brand"><img src="../learning-bird-store-icon-512.png">LEARNING BIRD</div>
    <div class="tag">1.0 候选测试版</div>
    <h1 class="title">把每一天，<br><span>学得更有方向。</span></h1>
    <p class="lead">计划、背词、专注、资料，一个应用安排清楚。<br>为考研与长期学习打造的离线学习管理工具。</p>
    <div class="phones">
      <div class="phone p1"><img src="../screenshots/02-word-books.png"></div>
      <div class="phone p2"><img src="../screenshots/01-today.png"></div>
      <div class="phone p3"><img src="../screenshots/04-week-plan.png"></div>
    </div>
    <div class="features">
      <div class="feature"><b>▦</b>周规划课表</div>
      <div class="feature"><b>Aa</b>科学背词</div>
      <div class="feature"><b>◷</b>番茄专注</div>
      <div class="feature"><b>▤</b>本地资料库</div>
    </div>
    <div class="foot">Learning Bird · 不是把计划写得更满，而是让每一次学习都有去处。</div>
  </main>
</body>
</html>
